name: CI Test & Build Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit, API & Agent Evaluation Suite
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      PORT: 4000
      NODE_ENV: test
      GOLD_RATE_24K_PER_GRAM: 7000
      LLM_PROVIDER: mock

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Environment Files
        run: |
          cp .env.example .env
          cp .env.example server/.env

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client & Migrate DB
        run: |
          cd server
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Seed Database
        run: npm run seed

      - name: Run Full Test Suite (Unit & API)
        run: npm test

      - name: Run AI Agent Evaluation Conversations
        run: npm run eval

      - name: Build Web Client & Backend
        run: npm run build
